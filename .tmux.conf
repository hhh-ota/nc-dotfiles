# Basic
# -----

# Prefix: Ctrl-b -> Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support
set -g mouse on

# Start window / pane index from 1
set -g base-index 1
setw -g pane-base-index 1

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"

# Faster key response
set -sg escape-time 10

# History limit
set -g history-limit 100000

# True color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Pane splitting
# --------------

# Split panes with | and -
unbind %
unbind '"'
bind | split-window -h
bind - split-window -v

# Keep current directory when splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Create new window in current directory
bind c new-window -c "#{pane_current_path}"

# Pane navigation
# ---------------

# Vim-like pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
# -----------------

# Move between windows
bind -n M-h previous-window
bind -n M-l next-window

# Rename window
bind , command-prompt -I "#W" "rename-window '%%'"

# Kill pane/window more safely
bind x confirm-before -p "kill-pane? (y/n)" kill-pane
bind & confirm-before -p "kill-window? (y/n)" kill-window

# Copy mode
# ---------

setw -g mode-keys vi

# Enter copy mode
bind [ copy-mode

# Vim-like copy mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send -X cancel

# Paste
bind p paste-buffer

# Status bar
# ----------

set -g status on
set -g status-position bottom
set -g status-interval 5

set -g status-left-length 40
set -g status-right-length 100

set -g status-left "#[bold] #S "
set -g status-right " #[bold]%Y-%m-%d #[bold]%H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #[bold]#I:#W* "

set -g status-style "bg=default,fg=white"
set -g window-status-style "fg=colour245,bg=default"
set -g window-status-current-style "fg=white,bg=colour238,bold"

# Quality of life
# ---------------

# Automatically renumber windows after closing one
set -g renumber-windows on

# Do not rename windows automatically
set -g allow-rename off

# Focus events for Neovim etc.
set -g focus-events on

# Display pane numbers longer
set -g display-panes-time 1500

# Plugin manager path
# -------------------

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# Plugins
# -------

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Better default tmux settings
set -g @plugin 'tmux-plugins/tmux-sensible'

# Theme / status line
set -g @plugin 'catppuccin/tmux'

# Save and restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Automatically save tmux sessions
set -g @plugin 'tmux-plugins/tmux-continuum'

# Open highlighted file paths / URLs
set -g @plugin 'tmux-plugins/tmux-open'

# Yank text to system clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

# Catppuccin theme settings
# -------------------------

# Theme flavor: latte, frappe, macchiato, mocha
set -g @catppuccin_flavor 'mocha'

# Window style
set -g @catppuccin_window_status_style 'rounded'

# Left status
set -g status-left-length 100
set -g status-left ""
set -g status-left "#{E:@catppuccin_status_session}"

# Right status
set -g status-right-length 100
set -g status-right ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Date/time format
set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M"

# Plugin settings
# ---------------

# tmux-continuum: auto save every 15 minutes
set -g @continuum-save-interval '15'

# tmux-continuum: restore session automatically when tmux starts
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager
# ------------------------------

# This line must be at the very bottom of tmux.conf
run '~/.config/tmux/plugins/tpm/tpm'
